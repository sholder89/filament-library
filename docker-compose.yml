services:
  filament-library:
    build: .
    image: filament-library:latest
    container_name: filament-library
    restart: unless-stopped

    ports:
      # Direct LAN access alongside the reverse proxy. Restrict or drop this in
      # docker-compose.override.yml if you only want to reach it through Traefik.
      - "${HOST_PORT:-8088}:8080"

    volumes:
      # The SQLite database. Back this folder up and you've backed up everything.
      - ./data:/data

    networks:
      - proxy

    environment:
      # User the app runs as. Must be able to write ./data — the entrypoint
      # takes care of that for you. Set these to `id -u` / `id -g` if you want
      # the database files owned by your own account on the host.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      # Pin the URL the QR codes point at. Leave empty and the app uses whatever
      # host you browsed in on, which is usually what you want on a home LAN.
      # Set it to your https:// hostname when running behind a reverse proxy.
      APP_BASE_URL: ${APP_BASE_URL:-}

      # Honour X-Forwarded-Proto/Host from the proxy so generated URLs get the
      # right scheme. Only enable when the app is actually behind one.
      TRUST_PROXY: ${TRUST_PROXY:-}

      # Voice Label Printer — prints go through the relay server, the same path
      # Alexa and Siri use. The Windows client picks the job up on its next poll.
      LABEL_RELAY_URL: ${LABEL_RELAY_URL:-}
      LABEL_TOKEN: ${LABEL_TOKEN:-}

      # Style and size travel with each job, so filament labels never change
      # the printer's saved settings.
      LABEL_SIZE: ${LABEL_SIZE:-2x1}
      LABEL_QR_SHOW_TEXT: ${LABEL_QR_SHOW_TEXT:-0}
      LABEL_NAME_LABEL: ${LABEL_NAME_LABEL:-0}

      # Optional escape hatch: talk straight to the Windows client instead.
      LABEL_MODE: ${LABEL_MODE:-auto}
      LABEL_CLIENT_URL: ${LABEL_CLIENT_URL:-}

      TZ: ${TZ:-UTC}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filament-library.entrypoints=http"
      - "traefik.http.routers.filament-library.rule=Host(`your-domain.com`)"  # override in docker-compose.override.yml
      - "traefik.http.middlewares.filament-library-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.filament-library.middlewares=filament-library-https-redirect"
      - "traefik.http.routers.filament-library-secure.entrypoints=https"
      - "traefik.http.routers.filament-library-secure.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.filament-library-secure.tls=true"
      - "traefik.http.routers.filament-library-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.filament-library-secure.service=filament-library"
      - "traefik.http.services.filament-library.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
      - "com.centurylinklabs.watchtower.enable=false"

    # Only needed if something you point at runs on the Docker host itself;
    # reaching another machine on the LAN (the Windows print PC) works without
    # it. Harmless to leave in place.
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  proxy:
    external: true
