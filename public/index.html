<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filament Library</title>
<meta name="description" content="3D printing filament inventory">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filament">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".35"/>
      <circle cx="16" cy="16" r="9"  fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="16" cy="16" r="3.2" fill="var(--bg)"/>
    </svg>
    <h1>Filament Library</h1>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="currentColor"/></svg>
    </button>
    <a class="icon-btn" id="exportBtn" href="/api/export" title="Export inventory as JSON" aria-label="Export inventory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</header>

<section class="stats" id="stats" aria-label="Inventory summary"></section>

<section class="toolbar">
  <div class="segmented" id="statusFilter" role="tablist" aria-label="Filter by status">
    <button role="tab" data-status="active"  class="on">All</button>
    <button role="tab" data-status="new">Sealed</button>
    <button role="tab" data-status="opened">Opened</button>
    <button role="tab" data-status="empty">Used&nbsp;up</button>
  </div>

  <div class="filters">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="search" placeholder="Search brand, color, notes…" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="filter-wrap">
      <button type="button" class="filter-btn" id="brandFilterBtn" aria-haspopup="true" aria-expanded="false">
        <span id="brandFilterLabel">All brands</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="filter-wrap">
      <button type="button" class="filter-btn" id="materialFilterBtn" aria-haspopup="true" aria-expanded="false">
        <span id="materialFilterLabel">All types</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="filter-wrap">
      <button type="button" class="filter-btn" id="finishFilterBtn" aria-haspopup="true" aria-expanded="false">
        <span id="finishFilterLabel">All finishes</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <select id="sortBy" aria-label="Sort order">
      <option value="newest">Newest first</option>
      <option value="brand">Brand A–Z</option>
      <option value="material">Type A–Z</option>
      <option value="color">Color A–Z</option>
      <option value="opened">Recently opened</option>
    </select>
    <button class="ghost-btn" id="clearFilters" hidden>Clear</button>
  </div>
</section>

<main id="grid" class="grid" aria-live="polite"></main>

<div class="fab-stack">
  <button class="fab fab-secondary" id="scanBtn" aria-label="Scan a spool's QR code" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>
  <button class="fab" id="addBtn" aria-label="Add filament">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span>Add</span>
  </button>
</div>

<!-- ── Detail sheet ──────────────────────────────────────────────────────── -->
<dialog id="detail" class="sheet">
  <div class="sheet-inner" id="detailBody"></div>
</dialog>

<!-- ── Add / edit form ───────────────────────────────────────────────────── -->
<dialog id="editor" class="sheet">
  <form class="sheet-inner" id="editorForm" method="dialog">
    <div class="sheet-head">
      <h2 id="editorTitle">Add filament</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="preview-row">
      <div id="editorPreview" class="preview-spool"></div>
      <div class="preview-caption">
        <strong id="previewName">New spool</strong>
        <span id="previewSub"></span>
      </div>
    </div>

    <!-- Picker + free-text pair: the select carries `required` so an empty
         choice complains on a control the browser can actually focus, and the
         text input only becomes required once "Something else" is picked. -->
    <div class="field">
      <label for="f_brand_pick">Brand</label>
      <select id="f_brand_pick" required></select>
      <input id="f_brand" name="brand" placeholder="Enter a brand name" autocomplete="off" enterkeyhint="next" hidden>
    </div>

    <div class="field">
      <label for="f_material_pick">Type</label>
      <select id="f_material_pick" required></select>
      <input id="f_material" name="material" placeholder="Enter a filament type" autocomplete="off" enterkeyhint="next" hidden>
      <p class="hint" id="materialHint"></p>
    </div>

    <div class="field">
      <label for="f_finish">Finish</label>
      <select id="f_finish" name="finish">
        <option value="">Standard — no special finish</option>
      </select>
      <p class="hint" id="finishHint"></p>
    </div>

    <div class="field">
      <label for="f_color_name">Color</label>
      <input id="f_color_name" name="color_name" list="colorList" placeholder="Black, Galaxy Blue…" autocomplete="off">
      <datalist id="colorList"></datalist>
      <div class="swatches" id="swatches"></div>
      <div class="hexrow">
        <input type="color" id="f_color_hex" name="color_hex" value="#808080" aria-label="Exact color">
        <input type="text" id="f_color_hex_text" inputmode="text" spellcheck="false" aria-label="Color hex code" maxlength="7">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f_status">Condition</label>
        <select id="f_status" name="status">
          <option value="new">Sealed / new</option>
          <option value="opened">Opened</option>
          <option value="empty">Used up</option>
        </select>
      </div>
      <div class="field">
        <label for="f_spool_weight_g">Spool size (g)</label>
        <!-- step must stay 1: a coarser step builds its ladder from min, which
             would make ordinary weights like 1000 g fail validation. -->
        <input id="f_spool_weight_g" name="spool_weight_g" type="number" inputmode="numeric"
               min="1" step="1" value="1000" list="weightList">
        <datalist id="weightList"></datalist>
      </div>
    </div>

    <!-- Only shown when adding an already-opened spool. Once it's in the
         library, how much is left is adjusted on the spool's own page. -->
    <div class="field" id="remainingField" hidden>
      <label for="f_remaining_pct">How much is left — <output id="remainingOut">100%</output></label>
      <input id="f_remaining_pct" name="remaining_pct" type="range" min="0" max="100" step="5" value="100">
      <div class="remaining-quick" id="editorRemainingQuick">
        <button type="button" data-pct="25">25%</button>
        <button type="button" data-pct="50">50%</button>
        <button type="button" data-pct="75">75%</button>
        <button type="button" data-pct="100">100%</button>
      </div>
    </div>

    <div class="field" id="quantityField">
      <label for="f_quantity">How many of these?</label>
      <div class="stepper">
        <button type="button" data-step="-1" aria-label="One fewer">−</button>
        <input id="f_quantity" name="quantity" type="number" inputmode="numeric" min="1" max="20" step="1" value="1">
        <button type="button" data-step="1" aria-label="One more">+</button>
      </div>
      <p class="hint">Adds a separate record per spool, so you can open and use them up one at a time.</p>
    </div>

    <details class="more">
      <summary>More details</summary>

      <div class="field-row">
        <div class="field">
          <label for="f_diameter">Diameter (mm)</label>
          <select id="f_diameter" name="diameter">
            <option value="1.75">1.75</option>
            <option value="2.85">2.85</option>
            <option value="3">3.00</option>
          </select>
        </div>
        <div class="field">
          <label for="f_price">Price paid</label>
          <input id="f_price" name="price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="—">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f_nozzle_temp">Nozzle °C</label>
          <input id="f_nozzle_temp" name="nozzle_temp" type="number" inputmode="numeric" min="0" max="600">
        </div>
        <div class="field">
          <label for="f_bed_temp">Bed °C</label>
          <input id="f_bed_temp" name="bed_temp" type="number" inputmode="numeric" min="0" max="300">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f_purchased_at">Purchased</label>
          <input id="f_purchased_at" name="purchased_at" type="date">
        </div>
        <div class="field">
          <label for="f_location">Stored in</label>
          <input id="f_location" name="location" list="locationList" placeholder="Dry box A, shelf…" autocomplete="off">
          <datalist id="locationList"></datalist>
        </div>
      </div>

      <div class="field">
        <label for="f_notes">Notes</label>
        <textarea id="f_notes" name="notes" rows="3" placeholder="Prints great at 45mm/s…"></textarea>
      </div>
    </details>

    <p class="form-error" id="editorError" hidden></p>

    <div class="sheet-actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>

      <!-- Split button: the main half does whatever you chose last time, the
           chevron lets you pick the other action (and remembers it). -->
      <div class="split-btn" id="saveSplit">
        <button type="submit" class="btn primary" id="saveBtn">Add to library</button>
        <button type="button" class="btn primary split-toggle" id="saveModeBtn"
                aria-haspopup="true" aria-expanded="false" aria-label="Choose what happens when you save">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="split-menu" id="saveMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-mode="save">
            <span class="split-tick" aria-hidden="true">✓</span> Add to library
          </button>
          <button type="button" role="menuitem" data-mode="print">
            <span class="split-tick" aria-hidden="true">✓</span> Add and print QR
          </button>
        </div>
      </div>
    </div>
  </form>
</dialog>

<!-- ── Multi-select filter popover (shared by all three filters) ──────────
     A dropdown anchored under its button on desktop; a bottom sheet on
     narrow screens. It's moved into the active .filter-wrap when opened, so
     the desktop anchoring falls out of normal positioning. -->
<div class="picker-scrim" id="pickerScrim" hidden></div>
<div class="picker-pop" id="picker" role="dialog" aria-label="Filter options" hidden>
  <div class="picker-head">
    <h2 id="pickerTitle">Filter</h2>
    <button type="button" class="icon-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <p class="hint" id="pickerHint">Pick as many as you like.</p>
  <div class="option-list" id="pickerOptions"></div>
  <div class="picker-actions">
    <button type="button" class="btn ghost" id="pickerClear">Clear all</button>
    <button type="button" class="btn primary" data-close>Done</button>
  </div>
</div>

<!-- ── QR scanner ────────────────────────────────────────────────────────── -->
<dialog id="scanner" class="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2>Scan a spool</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="scan-stage">
      <video id="scanVideo" playsinline muted></video>
      <div class="scan-reticle" aria-hidden="true"></div>
    </div>
    <div class="scan-zoom" id="scanZoom" hidden>
      <label for="scanZoomRange">Zoom</label>
      <input type="range" id="scanZoomRange" min="1" max="4" step="0.1" value="1">
      <output id="scanZoomOut">1.0×</output>
    </div>
    <p class="hint" id="scanStatus">Hold the label about 15–20&nbsp;cm away and fill the box.</p>
    <p class="hint" id="scanDiag"></p>
    <p class="form-error" id="scanError" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="btn ghost wide" data-close>Cancel</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
