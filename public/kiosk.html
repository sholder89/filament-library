<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Filament Kiosk</title>
<!-- The bench touchscreen: a spool's label goes up to the camera, big buttons
     come back. Not the library — just the things you do to a roll at the
     printer, and adding a new one from its label. The Pi's scanning daemon
     drives it through kioskOpen(), feeds the camera through kioskFrame(), and
     answers a label photo through kioskLabelRead(); see kiosk.js. -->
<link rel="stylesheet" href="/kiosk.css">
</head>
<body>

<!-- ── Waiting for a label ─────────────────────────────────────────────── -->
<section id="scanView" class="view">
  <div class="viewfinder">
    <img id="cam" alt="">
    <div class="finder-frame" aria-hidden="true"></div>
    <p class="finder-hint">Hold a spool's label up to the camera</p>
    <p class="finder-off" id="camOff">Camera starting…</p>
  </div>

  <aside class="side">
    <button class="add-btn" id="addBtn" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add a new spool
    </button>
    <h2>In the printers</h2>
    <div id="printerList" class="printer-list"></div>
    <h2 id="recentHead" hidden>Recently used</h2>
    <div id="recentList" class="recent-list"></div>
  </aside>
</section>

<!-- ── One spool ───────────────────────────────────────────────────────── -->
<section id="spoolView" class="view" hidden>
  <header class="spool-head">
    <button class="back" id="backBtn" aria-label="Back to scanning">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Scan
    </button>
    <div class="spool-title">
      <h1><span id="spoolName"></span><span class="scan-chip" id="scanChip" hidden>Scanned</span></h1>
      <p id="spoolSub"></p>
    </div>
    <button class="head-btn" id="printBtn" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>
      Print label
    </button>
    <img id="camMini" class="cam-mini" alt="" hidden>
  </header>

  <div class="spool-body">
    <div class="spool-left">
      <div id="spoolArt" class="spool-art"></div>
      <p id="spoolLeft" class="spool-left-text"></p>
      <p id="spoolWhere" class="spool-where"></p>
      <div id="rollAction" class="roll-action"></div>
    </div>
    <div id="actions" class="actions"></div>
  </div>
</section>

<!-- ── A new spool, from its label ────────────────────────────────────── -->
<section id="addView" class="view" hidden>
  <header class="spool-head add-head">
    <button class="back" id="addCancel" aria-label="Cancel adding">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round"/></svg>
      Cancel
    </button>
    <div class="spool-title">
      <h1>New spool</h1>
      <p>Lay it label-up under the camera, then read the label</p>
    </div>
  </header>

  <div class="add-body">
    <div class="add-left">
      <div class="viewfinder add-finder" id="addFinder">
        <img id="camAdd" alt="">
        <div class="finder-frame" aria-hidden="true"></div>
      </div>
      <button class="act primary" id="readBtn">Read label</button>
      <p class="read-note" id="readNote"></p>
    </div>
    <div class="add-right">
      <div class="tiles" id="addTiles"></div>
      <button class="act primary" id="addSave" disabled>Add to library</button>
    </div>
  </div>
</section>

<!-- One list to choose from, for whichever detail of a new spool was tapped:
     a pick rather than a keyboard, which this screen doesn't have. -->
<div id="picker" class="picker" hidden>
  <div class="picker-panel">
    <header class="picker-head">
      <h2 id="pickerTitle"></h2>
      <button class="back" id="pickerClose">Done</button>
    </header>
    <div id="pickerList" class="picker-list"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="/kiosk.js"></script>
</body>
</html>
